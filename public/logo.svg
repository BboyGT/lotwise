<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hexGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD56B"/>
      <stop offset="50%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <linearGradient id="candleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD56B"/>
      <stop offset="100%" stop-color="#FF8800"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagon outline -->
  <path d="M60 6 L105 32 L105 88 L60 114 L15 88 L15 32 Z"
        fill="none"
        stroke="url(#hexGrad)"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Inner hexagon glow accent -->
  <path d="M60 14 L98 36 L98 84 L60 106 L22 84 L22 36 Z"
        fill="url(#hexGrad)"
        fill-opacity="0.08"
        stroke="url(#hexGrad)"
        stroke-width="1"
        stroke-opacity="0.3"/>

  <!-- Bullish candlestick (left, taller) -->
  <g filter="url(#glow)">
    <!-- Wick -->
    <line x1="42" y1="34" x2="42" y2="86" stroke="url(#candleGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="34" y="48" width="16" height="26" rx="2" fill="url(#candleGrad)"/>
    <!-- Highlight -->
    <rect x="36" y="50" width="3" height="22" rx="1" fill="#FFE9A8" fill-opacity="0.6"/>
  </g>

  <!-- Bearish candlestick (right, shorter, inverted color) -->
  <g filter="url(#glow)" opacity="0.85">
    <!-- Wick -->
    <line x1="78" y1="40" x2="78" y2="84" stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="70" y="52" width="16" height="22" rx="2" fill="#FF6B6B"/>
    <!-- Shadow -->
    <rect x="72" y="54" width="3" height="18" rx="1" fill="#FFB8B8" fill-opacity="0.5"/>
  </g>

  <!-- Center "forge" spark -->
  <circle cx="60" cy="60" r="3" fill="#FFD56B" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="1.5" fill="#FFFCE8"/>
</svg>
