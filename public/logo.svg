<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1410"/>
      <stop offset="100%" stop-color="#0A0805"/>
    </linearGradient>
    <linearGradient id="lGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="50%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#FFE9A8"/>
    </linearGradient>
    <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square frame -->
  <rect x="6" y="6" width="108" height="108" rx="22" fill="url(#bgGrad)" stroke="url(#lGrad)" stroke-width="2.5"/>

  <!-- Inner border accent (top-left glow) -->
  <rect x="10" y="10" width="100" height="100" rx="18" fill="none" stroke="url(#lGrad)" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- The "L" lettermark — vertical stem + horizontal base -->
  <g filter="url(#logoGlow)">
    <!-- Vertical stem of L -->
    <rect x="34" y="32" width="14" height="52" rx="3" fill="url(#lGrad)"/>
    <!-- Inner highlight on stem -->
    <rect x="36" y="34" width="3" height="48" rx="1.5" fill="#FFFCE8" fill-opacity="0.5"/>

    <!-- Horizontal base of L that extends into the trend arrow -->
    <rect x="34" y="70" width="38" height="14" rx="3" fill="url(#lGrad)"/>
    <!-- Inner highlight on base -->
    <rect x="36" y="72" width="34" height="3" rx="1.5" fill="#FFFCE8" fill-opacity="0.5"/>
  </g>

  <!-- Trend arrow extending from the L's base — represents "sizing up" -->
  <g filter="url(#logoGlow)">
    <!-- Arrow shaft (tapered, ascending) -->
    <path d="M70 70 L82 70 L82 50 L92 50" stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Arrowhead -->
    <path d="M85 44 L95 50 L85 56 Z" fill="url(#arrowGrad)"/>
  </g>

  <!-- Small spark dot at the arrow tip — "forge spark" of activity -->
  <circle cx="95" cy="50" r="1.5" fill="#FFFCE8" filter="url(#logoGlow)"/>
</svg>
